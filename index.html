<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Kas Tunai</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- SheetJS (Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- jsPDF & AutoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">Buku Kas Tunai</h1>
      <button onclick="fetchData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">
        🔄 Refresh Data
      </button>
    </header>

    <!-- Ringkasan Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Total Pemasukan</p>
        <p id="totalMasuk" class="text-xl font-bold text-emerald-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Total Pengeluaran</p>
        <p id="totalKeluar" class="text-xl font-bold text-rose-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Saldo Kas</p>
        <p id="saldo" class="text-xl font-bold text-blue-600 mt-1">Rp 0</p>
      </div>
    </div>

    <!-- Grafik Arus Kas -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">Grafik Arus Kas Bulanan</h2>
      <div class="relative w-full h-72">
        <canvas id="kasChart"></canvas>
      </div>
    </div>

    <!-- Form Input Multi-Transaksi -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">Tambah Banyak Transaksi</h2>
      <form id="kasForm" onsubmit="handleSubmit(event)" class="space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pb-2 border-b border-gray-100">
          <div>
            <label class="block text-sm text-gray-600 mb-1 font-medium">Jenis Transaksi</label>
            <select id="type" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Pemasukan">Pemasukan (+)</option>
              <option value="Pengeluaran">Pengeluaran (-)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1 font-medium">Tanggal</label>
            <input type="date" id="tanggal" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <!-- Container Baris Transaksi -->
        <div id="itemContainer" class="space-y-3">
          <div class="item-row flex items-center gap-2">
            <input type="text" placeholder="Uraian / Keterangan" required class="uraian-input flex-1 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="number" min="1" placeholder="Nominal (Rp)" oninput="calculateSubtotal()" required class="nominal-input w-40 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="button" onclick="removeRow(this)" class="text-rose-500 hover:text-rose-700 p-2 text-lg font-bold disabled:opacity-30" disabled>✕</button>
          </div>
        </div>

        <!-- Live Subtotal -->
        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-200">
          <span class="text-sm font-medium text-gray-600">Total Input Nominal:</span>
          <span id="inputSubtotal" class="text-lg font-bold text-blue-600">Rp 0</span>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="addRow()" class="w-1/3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 rounded-lg transition">
            + Baris
          </button>
          <button type="submit" id="btnSubmit" class="w-2/3 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow">
            Simpan Semua Transaksi
          </button>
        </div>
      </form>
    </div>

    <!-- Filter Rentang Tanggal & Ekspor -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Dari Tanggal</label>
          <input type="date" id="filterStart" onchange="applyFilter()" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Sampai Tanggal</label>
          <input type="date" id="filterEnd" onchange="applyFilter()" class="border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div class="self-end">
          <button onclick="resetFilter()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-2 rounded-lg text-sm font-medium transition">
            Reset
          </button>
        </div>
      </div>

      <div class="flex gap-2">
        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm">
          📊 Ekspor Excel
        </button>
        <button onclick="exportToPDF()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 shadow-sm">
          📄 Ekspor PDF
        </button>
      </div>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Tabel Pemasukan -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h3 class="font-semibold text-emerald-600 mb-3">Riwayat Pemasukan</h3>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-gray-50 text-gray-500 sticky top-0">
              <tr>
                <th class="p-2">Tgl</th>
                <th class="p-2">Uraian</th>
                <th class="p-2 text-right">Nominal</th>
                <th class="p-2 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbPemasukan">
              <tr><td colspan="4" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tabel Pengeluaran -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h3 class="font-semibold text-rose-600 mb-3">Riwayat Pengeluaran</h3>
        <div class="overflow-x-auto max-h-72">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-gray-50 text-gray-500 sticky top-0">
              <tr>
                <th class="p-2">Tgl</th>
                <th class="p-2">Uraian</th>
                <th class="p-2 text-right">Nominal</th>
                <th class="p-2 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tbPengeluaran">
              <tr><td colspan="4" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Edit Transaksi -->
  <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-lg">
      <h3 class="text-lg font-semibold mb-4 text-gray-800">Edit Transaksi</h3>
      <form id="editForm" onsubmit="handleEditSubmit(event)" class="space-y-4">
        <input type="hidden" id="editId">
        <input type="hidden" id="editType">
        
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Tanggal</label>
          <input type="date" id="editTanggal" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Uraian</label>
          <input type="text" id="editUraian" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 mb-1">Nominal (Rp)</label>
          <input type="number" id="editNominal" min="1" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-200">
            Batal
          </button>
          <button type="submit" id="btnSaveEdit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">
            Simpan Perubahan
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // GANTI SESUAI URL DEPLOYMENT WEB APP APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbxYbltfRc8rG5YktJ8yxoRjHQRbjPhKZCnL7QvqB187N63x5lDTpH9h5afGNVZ9wr8S/exec";

    let rawDataCache = { pemasukan: [], pengeluaran: [], totalMasuk: 0, totalKeluar: 0, saldo: 0 };
    let filteredDataCache = { pemasukan: [], pengeluaran: [], totalMasuk: 0, totalKeluar: 0, saldo: 0 };
    let chartInstance = null;

    document.getElementById('tanggal').valueAsDate = new Date();

    const formatRp = (val) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(val);

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        const data = await res.json();
        rawDataCache = data;
        applyFilter();
      } catch (err) {
        console.error("Gagal mengambil data:", err);
      }
    }

    function applyFilter() {
      const startVal = document.getElementById('filterStart').value;
      const endVal = document.getElementById('filterEnd').value;

      const startDate = startVal ? new Date(startVal) : null;
      const endDate = endVal ? new Date(endVal) : null;

      const inFiltered = rawDataCache.pemasukan.filter(item => {
        const itemDate = new Date(item.tanggal);
        if (startDate && itemDate < startDate) return false;
        if (endDate && itemDate > endDate) return false;
        return true;
      });

      const outFiltered = rawDataCache.pengeluaran.filter(item => {
        const itemDate = new Date(item.tanggal);
        if (startDate && itemDate < startDate) return false;
        if (endDate && itemDate > endDate) return false;
        return true;
      });

      const totalMasuk = inFiltered.reduce((sum, item) => sum + Number(item.nominal), 0);
      const totalKeluar = outFiltered.reduce((sum, item) => sum + Number(item.nominal), 0);
      const saldo = totalMasuk - totalKeluar;

      filteredDataCache = {
        pemasukan: inFiltered,
        pengeluaran: outFiltered,
        totalMasuk: totalMasuk,
        totalKeluar: totalKeluar,
        saldo: saldo
      };

      document.getElementById('totalMasuk').textContent = formatRp(totalMasuk);
      document.getElementById('totalKeluar').textContent = formatRp(totalKeluar);
      document.getElementById('saldo').textContent = formatRp(saldo);

      renderTable('tbPemasukan', inFiltered, 'text-emerald-600');
      renderTable('tbPengeluaran', outFiltered, 'text-rose-600');
      renderChart(inFiltered, outFiltered);
    }

    function resetFilter() {
      document.getElementById('filterStart').value = '';
      document.getElementById('filterEnd').value = '';
      applyFilter();
    }

    function renderTable(elementId, items, colorClass) {
      const tbody = document.getElementById(elementId);
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-400">Belum ada data</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(item => `
        <tr class="border-b border-gray-50 hover:bg-gray-50">
          <td class="p-2 text-xs text-gray-500">${item.tanggal}</td>
          <td class="p-2 font-medium">${item.uraian}</td>
          <td class="p-2 text-right font-semibold ${colorClass}">${formatRp(item.nominal)}</td>
          <td class="p-2 text-center">
            <button onclick="openEditModal('${item.id}', '${item.type}', '${item.tanggal}', '${escapeHtml(item.uraian)}', ${item.nominal})" class="text-blue-600 hover:text-blue-800 text-xs font-medium mr-1">
              ✏️
            </button>
            <button onclick="deleteTransaction('${item.id}', '${item.type}')" class="text-rose-600 hover:text-rose-800 text-xs font-medium">
              🗑️
            </button>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    function renderChart(inData, outData) {
      const monthlyData = {};

      inData.forEach(item => {
        if (!item.tanggal) return;
        const month = item.tanggal.substring(0, 7);
        if (!monthlyData[month]) monthlyData[month] = { masuk: 0, keluar: 0 };
        monthlyData[month].masuk += Number(item.nominal) || 0;
      });

      outData.forEach(item => {
        if (!item.tanggal) return;
        const month = item.tanggal.substring(0, 7);
        if (!monthlyData[month]) monthlyData[month] = { masuk: 0, keluar: 0 };
        monthlyData[month].keluar += Number(item.nominal) || 0;
      });

      const labels = Object.keys(monthlyData).sort();
      const dataMasuk = labels.map(m => monthlyData[m].masuk);
      const dataKeluar = labels.map(m => monthlyData[m].keluar);

      const ctx = document.getElementById('kasChart').getContext('2d');

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            { label: 'Pemasukan', data: dataMasuk, backgroundColor: '#10b981', borderRadius: 6 },
            { label: 'Pengeluaran', data: dataKeluar, backgroundColor: '#f43f5e', borderRadius: 6 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            tooltip: {
              callbacks: {
                label: (context) => `${context.dataset.label}: ${formatRp(context.raw)}`
              }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: (val) => 'Rp ' + val.toLocaleString('id-ID') }
            }
          }
        }
      });
    }

    function calculateSubtotal() {
      const inputs = document.querySelectorAll('.nominal-input');
      let total = 0;
      inputs.forEach(input => total += (parseFloat(input.value) || 0));
      document.getElementById('inputSubtotal').textContent = formatRp(total);
    }

    function addRow() {
      const container = document.getElementById('itemContainer');
      const newRow = document.createElement('div');
      newRow.className = 'item-row flex items-center gap-2';
      newRow.innerHTML = `
        <input type="text" placeholder="Uraian / Keterangan" required class="uraian-input flex-1 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        <input type="number" min="1" placeholder="Nominal (Rp)" oninput="calculateSubtotal()" required class="nominal-input w-40 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
        <button type="button" onclick="removeRow(this)" class="text-rose-500 hover:text-rose-700 p-2 text-lg font-bold">✕</button>
      `;
      container.appendChild(newRow);
      updateDeleteButtons();
    }

    function removeRow(btn) {
      const rows = document.querySelectorAll('.item-row');
      if (rows.length > 1) {
        btn.parentElement.remove();
        updateDeleteButtons();
        calculateSubtotal();
      }
    }

    function updateDeleteButtons() {
      const rows = document.querySelectorAll('.item-row');
      rows.forEach(row => row.querySelector('button').disabled = rows.length === 1);
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      const type = document.getElementById('type').value;
      const tanggal = document.getElementById('tanggal').value;
      
      const rows = document.querySelectorAll('.item-row');
      const items = Array.from(rows).map(row => ({
        uraian: row.querySelector('.uraian-input').value,
        nominal: row.querySelector('.nominal-input').value
      }));

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ type: type, tanggal: tanggal, items: items })
        });
        
        document.getElementById('itemContainer').innerHTML = `
          <div class="item-row flex items-center gap-2">
            <input type="text" placeholder="Uraian / Keterangan" required class="uraian-input flex-1 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            <input type="number" min="1" placeholder="Nominal (Rp)" oninput="calculateSubtotal()" required class="nominal-input w-40 border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            <button type="button" onclick="removeRow(this)" class="text-rose-500 hover:text-rose-700 p-2 text-lg font-bold disabled:opacity-30" disabled>✕</button>
          </div>
        `;
        calculateSubtotal();
        await fetchData();
      } catch (err) {
        alert("Gagal menyimpan data: " + err.message);
      } font-medium {
        btn.disabled = false;
        btn.textContent = "Simpan Semua Transaksi";
      }
    }

    async function deleteTransaction(id, type) {
      if (!confirm("Apakah Anda yakin ingin menghapus transaksi ini?")) return;
      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", id: id, type: type })
        });
        await fetchData();
      } catch (err) {
        alert("Gagal menghapus data: " + err.message);
      }
    }

    function openEditModal(id, type, tanggal, uraian, nominal) {
      document.getElementById('editId').value = id;
      document.getElementById('editType').value = type;
      document.getElementById('editTanggal').value = tanggal;
      document.getElementById('editUraian').value = uraian;
      document.getElementById('editNominal').value = nominal;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    async function handleEditSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSaveEdit');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      const payload = {
        action: "update",
        id: document.getElementById('editId').value,
        type: document.getElementById('editType').value,
        tanggal: document.getElementById('editTanggal').value,
        uraian: document.getElementById('editUraian').value,
        nominal: document.getElementById('editNominal').value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        closeEditModal();
        await fetchData();
      } catch (err) {
        alert("Gagal memperbarui data: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan Perubahan";
      }
    }

    function exportToExcel() {
      const wb = XLSX.utils.book_new();
      const inData = filteredDataCache.pemasukan.map(item => ({ "Tanggal": item.tanggal, "Uraian": item.uraian, "Nominal (Rp)": item.nominal }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(inData), "Pemasukan");

      const outData = filteredDataCache.pengeluaran.map(item => ({ "Tanggal": item.tanggal, "Uraian": item.uraian, "Nominal (Rp)": item.nominal }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(outData), "Pengeluaran");

      const summaryData = [
        { "Keterangan": "Total Pemasukan", "Jumlah (Rp)": filteredDataCache.totalMasuk },
        { "Keterangan": "Total Pengeluaran", "Jumlah (Rp)": filteredDataCache.totalKeluar },
        { "Keterangan": "Saldo Kas Periode Ini", "Jumlah (Rp)": filteredDataCache.saldo }
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryData), "Ringkasan Kas");
      XLSX.writeFile(wb, `Laporan_Buku_Kas.xlsx`);
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const startVal = document.getElementById('filterStart').value || 'Awal';
      const endVal = document.getElementById('filterEnd').value || 'Hari Ini';

      doc.setFontSize(16);
      doc.text("Laporan Buku Kas Tunai", 14, 15);
      doc.setFontSize(10);
      doc.text(`Periode: ${startVal} s/d ${endVal}`, 14, 22);

      doc.autoTable({
        startY: 28,
        head: [['Ringkasan Periode', 'Jumlah']],
        body: [
          ['Total Pemasukan', formatRp(filteredDataCache.totalMasuk)],
          ['Total Pengeluaran', formatRp(filteredDataCache.totalKeluar)],
          ['Saldo Kas Periode Ini', formatRp(filteredDataCache.saldo)]
        ],
        theme: 'bordered',
        headStyles: { fillColor: [59, 130, 246] }
      });

      doc.text("Riwayat Pemasukan", 14, doc.lastAutoTable.finalY + 10);
      const rowsIn = filteredDataCache.pemasukan.map(item => [item.tanggal, item.uraian, formatRp(item.nominal)]);
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 14,
        head: [['Tanggal', 'Uraian', 'Nominal']],
        body: rowsIn.length ? rowsIn : [['-', 'Tidak ada data', '-']],
        theme: 'striped',
        headStyles: { fillColor: [16, 185, 129] }
      });

      doc.text("Riwayat Pengeluaran", 14, doc.lastAutoTable.finalY + 10);
      const rowsOut = filteredDataCache.pengeluaran.map(item => [item.tanggal, item.uraian, formatRp(item.nominal)]);
      doc.autoTable({
        startY: doc.lastAutoTable.finalY + 14,
        head: [['Tanggal', 'Uraian', 'Nominal']],
        body: rowsOut.length ? rowsOut : [['-', 'Tidak ada data', '-']],
        theme: 'striped',
        headStyles: { fillColor: [244, 63, 94] }
      });

      doc.save(`Laporan_Buku_Kas.pdf`);
    }

    fetchData();
  </script>
</body>
</html>
