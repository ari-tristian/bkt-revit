<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Kas Tunai</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <header class="mb-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-800">Buku Kas Tunai</h1>
      <button onclick="fetchData()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">
        🔄 Refresh Data
      </button>
    </header>

    <!-- Ringkasan Dashboard -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Total Pemasukan</p>
        <p id="totalMasuk" class="text-xl font-bold text-emerald-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Total Pengeluaran</p>
        <p id="totalKeluar" class="text-xl font-bold text-rose-600 mt-1">Rp 0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <p class="text-xs text-gray-500 font-medium uppercase">Saldo Kas</p>
        <p id="saldo" class="text-xl font-bold text-blue-600 mt-1">Rp 0</p>
      </div>
    </div>

    <!-- Form Input -->
    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">Tambah Transaksi</h2>
      <form id="kasForm" onsubmit="handleSubmit(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">Jenis Transaksi</label>
            <select id="type" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Pemasukan">Pemasukan (+)</option>
              <option value="Pengeluaran">Pengeluaran (-)</option>
            </select>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">Tanggal</label>
            <input type="date" id="tanggal" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">Uraian / Keterangan</label>
            <input type="text" id="uraian" placeholder="Contoh: Penjualan Produk A" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">Nominal (Rp)</label>
            <input type="number" id="nominal" min="1" placeholder="0" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow">
          Simpan Transaksi
        </button>
      </form>
    </div>

    <!-- Riwayat Transaksi -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Tabel Pemasukan -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h3 class="font-semibold text-emerald-600 mb-3 flex justify-between items-center">
          <span>Riwayat Pemasukan</span>
        </h3>
        <div class="overflow-x-auto max-h-64">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-gray-50 text-gray-500 sticky top-0">
              <tr>
                <th class="p-2">Tgl</th>
                <th class="p-2">Uraian</th>
                <th class="p-2 text-right">Nominal</th>
              </tr>
            </thead>
            <tbody id="tbPemasukan">
              <tr><td colspan="3" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Tabel Pengeluaran -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h3 class="font-semibold text-rose-600 mb-3 flex justify-between items-center">
          <span>Riwayat Pengeluaran</span>
        </h3>
        <div class="overflow-x-auto max-h-64">
          <table class="w-full text-sm text-left border-collapse">
            <thead class="bg-gray-50 text-gray-500 sticky top-0">
              <tr>
                <th class="p-2">Tgl</th>
                <th class="p-2">Uraian</th>
                <th class="p-2 text-right">Nominal</th>
              </tr>
            </thead>
            <tbody id="tbPengeluaran">
              <tr><td colspan="3" class="p-4 text-center text-gray-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbxYbltfRc8rG5YktJ8yxoRjHQRbjPhKZCnL7QvqB187N63x5lDTpH9h5afGNVZ9wr8S/exec";

    // Set tanggal hari ini secara default pada input
    document.getElementById('tanggal').valueAsDate = new Date();

    const formatRp = (val) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(val);

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}?action=getData`);
        const data = await res.json();
        
        document.getElementById('totalMasuk').textContent = formatRp(data.totalMasuk);
        document.getElementById('totalKeluar').textContent = formatRp(data.totalKeluar);
        document.getElementById('saldo').textContent = formatRp(data.saldo);

        renderTable('tbPemasukan', data.pemasukan, 'text-emerald-600');
        renderTable('tbPengeluaran', data.pengeluaran, 'text-rose-600');
      } catch (err) {
        console.error("Gagal mengambil data:", err);
      }
    }

    function renderTable(elementId, items, colorClass) {
      const tbody = document.getElementById(elementId);
      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="p-4 text-center text-gray-400">Belum ada data</td></tr>`;
        return;
      }
      tbody.innerHTML = items.map(item => `
        <tr class="border-b border-gray-50 hover:bg-gray-50">
          <td class="p-2 text-xs text-gray-500">${item.tanggal}</td>
          <td class="p-2 font-medium">${item.uraian}</td>
          <td class="p-2 text-right font-semibold ${colorClass}">${formatRp(item.nominal)}</td>
        </tr>
      `).join('');
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = "Menyimpan...";

      const payload = {
        type: document.getElementById('type').value,
        tanggal: document.getElementById('tanggal').value,
        uraian: document.getElementById('uraian').value,
        nominal: document.getElementById('nominal').value
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        
        // Reset Form
        document.getElementById('uraian').value = '';
        document.getElementById('nominal').value = '';
        
        // Refresh Tampilan
        await fetchData();
      } catch (err) {
        alert("Gagal menyimpan data: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Simpan Transaksi";
      }
    }

    // Load data awal saat aplikasi dibuka
    fetchData();
  </script>
</body>
</html>
